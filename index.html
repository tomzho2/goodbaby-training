<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>培训签到表 - Goodbaby</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "SimSun", serif;
            background: #f5f5f5;
            color: #333;
            padding: 20px;
        }
        body.sign-page {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }
        .container { max-width: 1100px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 10px 0 15px;
        }
        .header h1 { font-size: 28px; font-weight: bold; letter-spacing: 8px; }
        .logo {
            position: absolute;
            right: 0; top: 50%;
            transform: translateY(-50%);
            background: #000; color: #fff;
            font-size: 18px; font-weight: bold;
            letter-spacing: 2px;
            padding: 4px 16px;
        }

        .info-section {
            background: #fff;
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 15px;
        }
        .info-section td {
            border: 1px solid #333;
            padding: 6px 12px;
            text-align: left;
            width: 50%;
        }
        .info-section td:first-child {
            width: 120px;
            white-space: nowrap;
            text-align: center;
        }
        .info-section input {
            width: 100%;
            border: none;
            outline: none;
            padding: 4px 8px;
            font-size: 14px;
            font-family: inherit;
            background: transparent;
        }

        .table-wrapper { overflow-x: auto; background: #fff; border: 1px solid #333; }
        .sign-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .sign-table th, .sign-table td {
            border: 1px solid #333;
            text-align: center;
            padding: 3px 2px;
            height: 28px;
            font-size: 12px;
        }
        .sign-table th { background: #fff; font-weight: normal; }
        .sign-table th:nth-child(1), .sign-table td:nth-child(1) { width: 40px; }
        .sign-table th:nth-child(2), .sign-table td:nth-child(2) { width: 85px; }
        .sign-table th:nth-child(3), .sign-table td:nth-child(3) { width: 75px; }
        .sign-table th:nth-child(4), .sign-table td:nth-child(4) { width: 70px; }
        .sign-table th:nth-child(5), .sign-table td:nth-child(5) { width: 85px; }
        .sign-table th:nth-child(6), .sign-table td:nth-child(6) { width: 40px; }
        .sign-table th:nth-child(7), .sign-table td:nth-child(7) { width: 85px; }
        .sign-table th:nth-child(8), .sign-table td:nth-child(8) { width: 75px; }
        .sign-table th:nth-child(9), .sign-table td:nth-child(9) { width: 70px; }
        .sign-table th:nth-child(10), .sign-table td:nth-child(10) { width: 85px; }
        .sign-table input {
            width: 100%;
            border: none;
            outline: none;
            text-align: center;
            font-size: 12px;
            font-family: inherit;
            padding: 1px 2px;
            background: transparent;
        }
        .sign-table input[readonly] { background: #fafafa; color: #333; }
        .sign-table input.highlight { background: #e6f7ff; }

        .toolbar {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar button {
            padding: 8px 18px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .toolbar button:hover { background: #e8e8e8; }
        .toolbar button.primary { background: #1890ff; color: #fff; border-color: #1890ff; }
        .toolbar button.primary:hover { background: #40a9ff; }
        .toolbar button.success { background: #52c41a; color: #fff; border-color: #52c41a; }
        .toolbar button.success:hover { background: #73d13d; }
        .toolbar button.danger { background: #ff4d4f; color: #fff; border-color: #ff4d4f; }
        .toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }

        .qr-area {
            display: flex;
            gap: 60px;
            justify-content: center;
            align-items: flex-start;
            margin: 25px 0;
            flex-wrap: wrap;
        }
        .qr-box {
            text-align: center;
            background: #fff;
            padding: 25px 40px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .qr-box h3 { margin-bottom: 15px; font-size: 18px; color: #333; }
        .qr-box .qrcode {
            padding: 15px;
            background: #fff;
            border: 2px dashed #d9d9d9;
            border-radius: 6px;
            display: inline-block;
        }
        .qr-tip { margin-top: 12px; font-size: 13px; color: #999; }

        .stats-bar { display: flex; gap: 20px; margin: 12px 0; flex-wrap: wrap; font-size: 14px; }
        .stats-bar span { background: #fff; padding: 6px 16px; border-radius: 20px; border: 1px solid #e8e8e8; }
        .stats-bar b { color: #1890ff; }

        .sync-status { 
            display: inline-block; 
            padding: 4px 12px; 
            border-radius: 12px; 
            font-size: 12px;
            margin-left: 10px;
        }
        .sync-status.connected { background: #d4edda; color: #155724; }
        .sync-status.disconnected { background: #f8d7da; color: #721c24; }

        /* 签到/签退页面容器 */
        .sign-page-container {
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        /* 签到/签退卡片 */
        .sign-card {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin: 0 auto 20px;
        }
        .sign-card h2 { text-align: center; margin-bottom: 6px; font-size: 22px; }
        .sign-card .subtitle { text-align: center; color: #999; font-size: 13px; margin-bottom: 20px; }
        .sign-card .form-group { margin-bottom: 14px; }
        .sign-card label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: bold; color: #555; }
        .sign-card input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        .sign-card input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
        .sign-card .btn-submit {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            margin-top: 8px;
        }
        .sign-card .btn-checkin { background: linear-gradient(135deg, #667eea, #764ba2); }
        .sign-card .btn-checkout { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .sign-card .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
        .sign-card .msg { text-align: center; margin-top: 12px; font-size: 14px; min-height: 22px; }
        .sign-card .msg.success { color: #52c41a; }
        .sign-card .msg.error { color: #ff4d4f; }

        /* 参会人员表格区域 */
        .attendee-section {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .attendee-section h3 {
            text-align: center;
            font-size: 17px;
            margin-bottom: 10px;
            color: #333;
        }
        .attendee-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 12px;
        }
        .attendee-table th, .attendee-table td {
            border: 1px solid #ddd;
            text-align: center;
            padding: 4px 2px;
            height: 26px;
        }
        .attendee-table th {
            background: #f5f5f5;
            font-weight: normal;
            font-size: 12px;
        }
        .attendee-table .signed { background: #e6ffe6; }
        .attendee-table .checked-out { background: #fff3cd; }
        .attendee-table .current-row { background: #e6f7ff; font-weight: bold; }

        .back-link { text-align: center; margin-top: 15px; font-size: 13px; }
        .back-link a { color: #fff; text-decoration: none; background: rgba(255,255,255,0.2); padding: 6px 20px; border-radius: 20px; display: inline-block;}

        /* 历史记录弹窗 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #fff; border-radius: 12px; padding: 25px; width: 90%; max-width: 700px;
            max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee;
        }
        .modal-header h3 { font-size: 18px; margin: 0; }
        .modal-close {
            background: none; border: none; font-size: 24px; cursor: pointer; color: #999;
            padding: 0; line-height: 1;
        }
        .modal-close:hover { color: #333; }
        .history-list { list-style: none; padding: 0; margin: 0; }
        .history-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 15px; border: 1px solid #e8e8e8; border-radius: 8px; margin-bottom: 10px;
            cursor: pointer; transition: all 0.2s;
        }
        .history-item:hover { border-color: #1890ff; background: #f0f9ff; }
        .history-item-info h4 { margin: 0 0 5px 0; font-size: 15px; }
        .history-item-info p { margin: 0; font-size: 13px; color: #666; }
        .history-item-actions { display: flex; gap: 10px; }
        .history-item-actions button {
            padding: 6px 15px; border: 1px solid #ddd; background: #fff; border-radius: 4px;
            cursor: pointer; font-size: 13px;
        }
        .history-item-actions button:hover { background: #f5f5f5; }
        .history-item-actions .btn-delete { color: #ff4d4f; border-color: #ff4d4f; }
        .history-item-actions .btn-delete:hover { background: #fff1f0; }
        .history-empty { text-align: center; color: #999; padding: 40px 0; }
        .new-training-btn {
            display: block; width: 100%; padding: 15px; background: #1890ff; color: #fff;
            border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-bottom: 15px;
        }
        .new-training-btn:hover { background: #40a9ff; }

        @media print {
            .toolbar, .qr-area, .stats-bar, .sync-status { display: none !important; }
            body { background: #fff !important; padding: 0 !important; }
            body.sign-page { background: #fff !important; min-height: auto !important; padding: 0 !important; }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }
            .container, .sign-page-container { max-width: 100% !important; margin: 0 auto !important; width: 100% !important; text-align: center; }
            .header {
                display: block !important; position: static !important; padding: 0 0 10px 0 !important;
                text-align: center !important;
            }
            .header h1 { letter-spacing: 8px; }
            .logo {
                position: absolute !important; right: 20px !important; top: 10px !important;
                background-color: #000 !important; color: #fff !important;
                font-size: 18px !important; font-weight: bold !important;
                letter-spacing: 2px !important; padding: 4px 16px !important;
                border-radius: 0 !important; box-shadow: none !important; border: none !important;
                display: inline-block !important;
            }
            .table-wrapper { border: 2px solid #000 !important; overflow: visible !important; }
            .info-section {
                border-collapse: collapse !important; border: 2px solid #000 !important;
                width: 100% !important; margin-bottom: 15px !important;
            }
            .info-section td {
                border: 1px solid #333 !important;
                padding: 6px 12px !important;
                text-align: left !important;
                background: #fff !important;
            }
            .sign-table { width: 100% !important; border-collapse: collapse !important; table-layout: fixed !important; }
            .sign-table th, .sign-table td { border: 1px solid #000 !important; height: 30px !important; background: #fff !important; }
            .sign-table input { border: none !important; background: #fff !important; color: #000 !important; }
            .sign-table input[readonly] { background: #fff !important; color: #000 !important; }
            .back-link, .sign-card, .attendee-section { display: none !important; }
        }
    </style>
</head>
<body id="mainBody">
<div class="container" id="mainPage">
    <div class="header">
        <h1>培 训 签 到 表</h1>
        <span class="logo">Goodbaby</span>
        <span class="sync-status disconnected" id="syncStatus">连接中...</span>
    </div>

    <table class="info-section">
        <tr>
            <td>培训课程</td><td><input type="text" id="course" placeholder="请输入培训课程"></td>
            <td>培训日期</td><td><input type="date" id="trainDate"></td>
        </tr>
        <tr>
            <td>培训时间</td><td><input type="text" id="trainTime" placeholder="例如：09:00-17:00"></td>
            <td>总培训小时</td><td><input type="number" id="totalHours" placeholder="例如：8" step="0.5"></td>
        </tr>
        <tr>
            <td>培训师</td><td><input type="text" id="trainer" placeholder="请输入培训师姓名"></td>
            <td>总培训人数</td><td><input type="number" id="totalCount" placeholder="自动统计或手动填写"></td>
        </tr>
        <tr>
            <td>培训地点</td><td><input type="text" id="location" placeholder="请输入培训地点"></td>
            <td>组织者</td><td><input type="text" id="organizer" placeholder="请输入组织者"></td>
        </tr>
    </table>

    <div class="stats-bar">
        <span>已签到：<b id="signedCount">0</b></span>
        <span>已签退：<b id="checkoutCount">0</b></span>
        <span>总记录数：<b id="recordCount">0</b></span>
    </div>

    <div class="toolbar">
        <button class="primary" onclick="generateQRCodes()">生成二维码</button>
        <button onclick="refreshData()">刷新数据</button>
        <button onclick="showHistory()">历史记录</button>
        <button class="success" onclick="exportExcel()">导出 Excel</button>
        <button onclick="window.print()">打印</button>
        <button class="danger" onclick="clearAllData()">清空所有数据</button>
    </div>

    <div class="qr-area" id="qrArea" style="display:none;"></div>

    <div class="table-wrapper">
        <table class="sign-table" id="signTable">
            <thead>
                <tr>
                    <th>序号</th><th>部门</th><th>员工编号</th><th>姓名</th><th>签名</th>
                    <th>序号</th><th>部门</th><th>员工编号</th><th>姓名</th><th>签名</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</div>

<!-- 历史记录弹窗 -->
<div class="modal-overlay" id="historyModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>历史培训记录</h3>
            <button class="modal-close" onclick="closeHistory()">&times;</button>
        </div>
        <button class="new-training-btn" onclick="createNewTraining()">+ 新建空白培训签到表</button>
        <ul class="history-list" id="historyList">
            <li class="history-empty">加载中...</li>
        </ul>
    </div>
</div>

<script>
// ==================== Supabase 配置 ====================
const SUPABASE_URL = 'https://wvfbebckgkkpoqdoypfo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2ZmJlYmNrZ2trcG9xZG95cGZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMzYyNjQsImV4cCI6MjA5NDcxMjI2NH0.VSROOREHHXLqF70DNs6jE_Xa7Dm72ChbJdv-2Q9oZHI';

var _sbClient = null;
var currentTrainingId = null;
var signRecords = [];
var realtimeChannel = null;

// ==================== 初始化 Supabase ====================
async function initSupabase() {
    try {
        _sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 测试连接
        var result = await _sbClient.from('training_info').select('id').limit(1);
        if (result.error) throw result.error;

        updateSyncStatus(true);

        // 每次打开都是空白状态，不自动加载数据
        // 数据通过"历史记录"手动加载

    } catch (error) {
        console.error('Supabase连接失败:', error);
        updateSyncStatus(false);
    }
}

function updateSyncStatus(connected) {
    var statusEl = document.getElementById('syncStatus');
    if (statusEl) {
        statusEl.textContent = connected ? '已连接' : '未连接';
        statusEl.className = 'sync-status ' + (connected ? 'connected' : 'disconnected');
    }
}

// ==================== 刷新数据 ====================
async function refreshData() {
    try {
        var btn = document.querySelector('button[onclick="refreshData()"]');
        if (btn) { btn.disabled = true; btn.textContent = '刷新中...'; }
        
        await loadLatestTraining();
        await loadSignRecords();
        
        if (btn) { btn.disabled = false; btn.textContent = '刷新数据'; }
    } catch (error) {
        console.error('刷新数据失败:', error);
        if (btn) { btn.disabled = false; btn.textContent = '刷新数据'; }
    }
}

// ==================== 加载最新培训 ====================
async function loadLatestTraining() {
    try {
        var result = await _sbClient
            .from('training_info')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(1);

        var trainings = result.data;
        var error = result.error;
        if (error) throw error;

        if (trainings && trainings.length > 0) {
            currentTrainingId = trainings[0].id;
            document.getElementById('course').value = trainings[0].course || '';
            document.getElementById('trainDate').value = trainings[0].train_date || '';
            document.getElementById('trainTime').value = trainings[0].train_time || '';
            document.getElementById('totalHours').value = trainings[0].total_hours || '';
            document.getElementById('trainer').value = trainings[0].trainer || '';
            document.getElementById('totalCount').value = trainings[0].total_count || '';
            document.getElementById('location').value = trainings[0].location || '';
            document.getElementById('organizer').value = trainings[0].organizer || '';

            // 加载签到记录
            await loadSignRecords();
        } else {
            renderTable();
        }
    } catch (error) {
        console.error('加载培训数据失败:', error);
    }
}

// ==================== 加载签到记录 ====================
async function loadSignRecords() {
    try {
        var result = await _sbClient
            .from('sign_records')
            .select('*')
            .eq('training_id', currentTrainingId)
            .order('row_index');

        if (result.error) throw result.error;

        signRecords = result.data || [];
        renderTable();
        updateStats();
    } catch (error) {
        console.error('加载签到记录失败:', error);
    }
}

// ==================== 订阅实时更新 ====================
function subscribeToChanges() {
    if (realtimeChannel) {
        _sbClient.removeChannel(realtimeChannel);
    }

    realtimeChannel = _sbClient
        .channel('sign_records_changes')
        .on('postgres_changes',
            { event: '*', schema: 'public', table: 'sign_records', filter: 'training_id=eq.' + currentTrainingId },
            function(payload) {
                console.log('收到更新:', payload);
                handleRealtimeChange(payload);
            }
        )
        .on('postgres_changes',
            { event: '*', schema: 'public', table: 'training_info' },
            function(payload) {
                if (payload.new && payload.new.id === currentTrainingId) {
                    var info = payload.new;
                    document.getElementById('course').value = info.course || '';
                    document.getElementById('trainDate').value = info.train_date || '';
                    document.getElementById('trainTime').value = info.train_time || '';
                    document.getElementById('totalHours').value = info.total_hours || '';
                    document.getElementById('trainer').value = info.trainer || '';
                    document.getElementById('totalCount').value = info.total_count || '';
                    document.getElementById('location').value = info.location || '';
                    document.getElementById('organizer').value = info.organizer || '';
                }
            }
        )
        .subscribe();
}

// ==================== 处理实时更新 ====================
function handleRealtimeChange(payload) {
    var eventType = payload.eventType;
    var newRecord = payload.new;
    var oldRecord = payload.old;

    if (eventType === 'INSERT' || eventType === 'UPDATE') {
        var existingIndex = signRecords.findIndex(function(r) { return r.row_index === newRecord.row_index; });
        if (existingIndex >= 0) {
            signRecords[existingIndex] = newRecord;
        } else {
            signRecords.push(newRecord);
        }
    } else if (eventType === 'DELETE') {
        signRecords = signRecords.filter(function(r) { return r.row_index !== oldRecord.row_index; });
    }

    renderTable();
    updateStats();
}

// ==================== 保存培训信息 ====================
async function saveInfo() {
    var info = {
        course: document.getElementById('course').value,
        train_date: document.getElementById('trainDate').value,
        train_time: document.getElementById('trainTime').value,
        total_hours: document.getElementById('totalHours').value,
        trainer: document.getElementById('trainer').value,
        total_count: document.getElementById('totalCount').value,
        location: document.getElementById('location').value,
        organizer: document.getElementById('organizer').value,
        updated_at: new Date().toISOString()
    };

    try {
        if (currentTrainingId) {
            var result = await _sbClient
                .from('training_info')
                .update(info)
                .eq('id', currentTrainingId);
            if (result.error) throw result.error;
        } else {
            var result = await _sbClient
                .from('training_info')
                .insert([info])
                .select();
            if (result.error) throw result.error;
            if (result.data && result.data.length > 0) {
                currentTrainingId = result.data[0].id;
            }
        }
    } catch (error) {
        console.error('保存培训信息失败:', error);
    }

    return info;
}

function findRecord(idx) {
    for (var i = 0; i < signRecords.length; i++) {
        if (signRecords[i].row_index === idx) return signRecords[i];
    }
    return {};
}

// ==================== 渲染参会者页面表格（固定25行两排，共50人） ====================
function renderAttendeeTable(records, currentEmpId) {
    var filledCount = records.filter(function(r){ return r.department && r.emp_id && r.name; }).length;
    var html =
        '<div class="attendee-section">' +
        '<h3>参会人员名单 (' + filledCount + '/50人)</h3>' +
        '<table class="attendee-table">' +
        '<thead><tr>' +
        '<th>序号</th><th>部门</th><th>员工编号</th><th>姓名</th><th>签名</th>' +
        '<th>序号</th><th>部门</th><th>员工编号</th><th>姓名</th><th>签名</th>' +
        '</tr></thead><tbody>';

    // 第一排 1-25，第二排 26-50
    for (var i = 0; i < 25; i++) {
        var leftIdx = i;
        var rightIdx = i + 25;
        var leftRec = findAttendeeRecord(records, leftIdx);
        var rightRec = findAttendeeRecord(records, rightIdx);
        var isCurrentLeft = currentEmpId && leftRec.emp_id === currentEmpId;
        var isCurrentRight = currentEmpId && rightRec.emp_id === currentEmpId;
        var leftCls = isCurrentLeft ? ' current-row' : (leftRec.signature ? ' checked-out' : (leftRec.name ? ' signed' : ''));
        var rightCls = isCurrentRight ? ' current-row' : (rightRec.signature ? ' checked-out' : (rightRec.name ? ' signed' : ''));

        html += '<tr>' +
            '<td class="' + leftCls + '">' + (leftIdx + 1) + '</td>' +
            '<td class="' + leftCls + '">' + esc(leftRec.department || '') + '</td>' +
            '<td class="' + leftCls + '">' + esc(leftRec.emp_id || '') + '</td>' +
            '<td class="' + leftCls + '">' + esc(leftRec.name || '') + '</td>' +
            '<td class="' + leftCls + '">' + esc(leftRec.signature || '') + '</td>' +
            '<td class="' + rightCls + '">' + (rightIdx + 1) + '</td>' +
            '<td class="' + rightCls + '">' + esc(rightRec.department || '') + '</td>' +
            '<td class="' + rightCls + '">' + esc(rightRec.emp_id || '') + '</td>' +
            '<td class="' + rightCls + '">' + esc(rightRec.name || '') + '</td>' +
            '<td class="' + rightCls + '">' + esc(rightRec.signature || '') + '</td>' +
            '</tr>';
    }

    html += '</tbody></table></div>';
    return html;
}

function findAttendeeRecord(records, idx) {
    for (var i = 0; i < records.length; i++) {
        if (records[i].row_index === idx) return records[i];
    }
    return {};
}

function esc(s) {
    if (!s) return '';
    return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ==================== 更新记录 ====================
async function updateRecord(el) {
    var idx = parseInt(el.getAttribute('data-idx'));
    var field = el.getAttribute('data-field');
    var value = el.value;

    // 先保存培训信息（确保有training_id）
    await saveInfo();

    // 查找现有记录
    var record = findRecord(idx);

    if (record.id) {
        // 更新现有记录
        var updateObj = {};
        updateObj[field] = value;
        updateObj.updated_at = new Date().toISOString();
        var result = await _sbClient.from('sign_records').update(updateObj).eq('id', record.id);
        if (result.error) console.error('更新失败:', result.error);
        else {
            record[field] = value;
        }
    } else {
        // 创建新记录
        var newObj = {
            training_id: currentTrainingId,
            row_index: idx,
            department: field === 'department' ? value : '',
            emp_id: field === 'emp_id' ? value : '',
            name: field === 'name' ? value : '',
            signature: field === 'signature' ? value : '',
            sign_type: null,
            updated_at: new Date().toISOString()
        };

        var result = await _sbClient
            .from('sign_records')
            .insert([newObj])
            .select();

        if (result.error) console.error('插入失败:', result.error);
        else if (result.data && result.data.length > 0) {
            signRecords.push(result.data[0]);
        }
    }

    updateStats();
}

function updateStats() {
    var signed = signRecords.filter(function(r) { return r.department && r.emp_id && r.name; }).length;
    var checkedOut = signRecords.filter(function(r) { return r.signature; }).length;

    document.getElementById('signedCount').textContent = signed;
    document.getElementById('checkoutCount').textContent = checkedOut;
    document.getElementById('recordCount').textContent = signRecords.length;

    if (!document.getElementById('totalCount').value && signed > 0) {
        document.getElementById('totalCount').value = signed;
    }
}

// ==================== 签到/签退页面（含50人两排参会表）====================
async function showSignPage(type) {
    var params = getUrlParams();
    var isCheckin = (type === 'checkin');

    // 从URL获取培训ID
    var trainingId = params['id'] ? atob(params['id']) : null;

    if (!trainingId) {
        document.body.innerHTML = '<div style="text-align:center;padding:50px;color:#fff;"><h2>无效的二维码</h2><p>请重新生成二维码</p></div>';
        return;
    }

    // 确保 Supabase 已初始化
    if (!_sbClient) {
        _sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // 获取培训信息
    var info = { course: '', train_date: '' };
    var allAttendees = [];
    try {
        var result = await _sbClient
            .from('training_info')
            .select('*')
            .eq('id', trainingId)
            .single();

        if (result.data) {
            info = result.data;
            currentTrainingId = trainingId;
        }

        // 获取所有签到记录
        var recResult = await _sbClient
            .from('sign_records')
            .select('*')
            .eq('training_id', trainingId)
            .order('row_index');

        allAttendees = recResult.data || [];
    } catch (e) {
        console.error('获取培训信息失败:', e);
    }

    // 构建页面
    var container = document.createElement('div');
    container.className = 'sign-page-container';

    var cardHtml =
        '<div class="sign-card">' +
            '<h2>' + (isCheckin ? '培 训 签 到' : '培 训 签 退') + '</h2>' +
            '<div class="subtitle">' + (info.course || '') + ' ' + (info.train_date || '') + '</div>' +
            '<form onsubmit="return false;">' +
            (isCheckin ? '<div class="form-group"><label>部门 *</label><input type="text" id="deptInput" placeholder="请输入部门名称" autocomplete="off"></div>' : '') +
            '<div class="form-group"><label>员工编号 *</label><input type="text" id="empIdInput" placeholder="请输入员工编号" autocomplete="off"></div>' +
            '<div class="form-group"><label>姓名 *</label><input type="text" id="nameInput" placeholder="请输入您的姓名" autocomplete="off"></div>' +
            '<button class="btn-submit ' + (isCheckin ? 'btn-checkin' : 'btn-checkout') + '" id="submitBtn">' + (isCheckin ? '确认签到' : '确认签退') + '</button>' +
            '<div class="msg" id="signMsg"></div>' +
            '</form>' +
        '</div>';

    var attendeeHtml = renderAttendeeTable(allAttendees, '');

    var backHtml =
        '<div class="back-link"><a href="' + window.location.href.split('?')[0].split('#')[0] + '">返回管理页面</a></div>';

    container.innerHTML = cardHtml + attendeeHtml + backHtml;
    document.body.innerHTML = '';
    document.body.className = 'sign-page';
    document.body.appendChild(container);

    // 绑定提交事件
    document.getElementById('submitBtn').onclick = async function() {
        var msgEl = document.getElementById('signMsg');
        var submitBtn = document.getElementById('submitBtn');
        var empId = document.getElementById('empIdInput').value.trim();
        var name = document.getElementById('nameInput').value.trim();

        if (!empId || !name) {
            msgEl.className = 'msg error';
            msgEl.textContent = '请填写必填项！';
            return;
        }

        // 显示加载状态
        submitBtn.disabled = true;
        submitBtn.textContent = isCheckin ? '签到中...' : '签退中...';
        msgEl.className = 'msg';
        msgEl.textContent = '';

        try {
            // 检查重复：查询该培训所有记录，按员工编号和姓名检查
            var allRecResult = await _sbClient
                .from('sign_records')
                .select('*')
                .eq('training_id', trainingId);

            var allRecords = allRecResult.data || [];

            // 检查员工编号是否已存在
            var dupByEmpId = allRecords.find(function(r) { return r.emp_id === empId; });
            // 检查姓名是否已存在（排除当前记录）
            var dupByName = allRecords.filter(function(r) { return r.name === name; });

            var dupMsg = '';
            if (dupByEmpId) {
                dupMsg = '员工编号 ' + empId + ' 已被 ' + dupByEmpId.name + ' 使用！';
            } else if (dupByName.length > 0) {
                dupMsg = '姓名 "' + name + '" 已存在（员工编号：' + dupByName[0].emp_id + '）！';
            }

            // 签到时检查重复
            if (isCheckin && dupMsg) {
                submitBtn.disabled = false;
                submitBtn.textContent = '确认签到';
                var confirmed = confirm('检测到重复提交！\n\n' + dupMsg + '\n\n是否继续签到？');
                if (!confirmed) {
                    msgEl.className = 'msg';
                    msgEl.textContent = '已取消签到';
                    setTimeout(function() { msgEl.textContent = ''; }, 2000);
                    return;
                }
                // 用户确认后继续执行
            }

            // 根据员工编号查找记录
            var existingRecords = allRecords.filter(function(r) { return r.emp_id === empId; });

            if (isCheckin) {
                var dept = document.getElementById('deptInput').value.trim();
                if (!dept) {
                    msgEl.className = 'msg error';
                    msgEl.textContent = '请填写部门！';
                    submitBtn.disabled = false;
                    submitBtn.textContent = '确认签到';
                    return;
                }

                // 查找匹配行或空行
                var idx = -1;
                if (existingRecords.length > 0) {
                    idx = existingRecords[0].row_index;
                } else {
                    // 找空行
                    var usedIndices = allRecords.map(function(r) { return r.row_index; });
                    for (var i = 0; i < 50; i++) {
                        if (usedIndices.indexOf(i) === -1) { idx = i; break; }
                    }
                    if (idx === -1) idx = allRecords.length;
                }

                if (existingRecords.length > 0) {
                    var updObj = { department: dept, name: name, updated_at: new Date().toISOString() };
                    var updResult = await _sbClient.from('sign_records').update(updObj).eq('id', existingRecords[0].id);
                    if (updResult.error) throw new Error('签到更新失败');
                } else {
                    var newRecord = {
                        training_id: trainingId,
                        row_index: idx,
                        department: dept,
                        emp_id: empId,
                        name: name,
                        signature: '',
                        sign_type: 'checkin'
                    };
                    var insResult = await _sbClient.from('sign_records').insert([newRecord]);
                    if (insResult.error) throw new Error('签到插入失败');
                }

                msgEl.className = 'msg success';
                msgEl.textContent = '签到成功！' + name + ' (' + dept + ')';
                document.getElementById('deptInput').value = '';
                document.getElementById('empIdInput').value = '';
                document.getElementById('nameInput').value = '';

                // 刷新参会人员表
                refreshAttendeeTable(trainingId, empId);

            } else {
                // 签退
                if (existingRecords.length === 0) {
                    msgEl.className = 'msg error';
                    msgEl.textContent = '未找到该员工的签到记录，请先签到！';
                    submitBtn.disabled = false;
                    submitBtn.textContent = '确认签退';
                    return;
                }

                // 签退时检查是否重复签退
                if (existingRecords[0].signature) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '确认签退';
                    var confirmed = confirm('该员工已于 ' + existingRecords[0].signature + ' 签退！\n\n是否重新签退？');
                    if (!confirmed) {
                        msgEl.className = 'msg';
                        msgEl.textContent = '已取消';
                        setTimeout(function() { msgEl.textContent = ''; }, 2000);
                        return;
                    }
                }

                var record = existingRecords[0];
                var now = new Date();
                var timeStr = (now.getHours() < 10 ? '0' : '') + now.getHours() + ':' +
                             (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
                var signatureText = name + ' ' + timeStr;

                var coResult = await _sbClient
                    .from('sign_records')
                    .update({ signature: signatureText, updated_at: new Date().toISOString() })
                    .eq('id', record.id);

                if (coResult.error) throw new Error('签退更新失败');

                msgEl.className = 'msg success';
                msgEl.textContent = '签退成功！' + name + ' ' + timeStr;
                document.getElementById('empIdInput').value = '';
                document.getElementById('nameInput').value = '';

                // 刷新参会人员表
                refreshAttendeeTable(trainingId, empId);
            }

            setTimeout(function() { msgEl.textContent = ''; }, 3000);

        } catch (error) {
            console.error('签到/签退失败:', error);
            msgEl.className = 'msg error';
            msgEl.textContent = '操作失败：' + (error.message || '请重试');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = isCheckin ? '确认签到' : '确认签退';
        }
    };
}

// ==================== URL 参数解析 ====================
function getUrlParams() {
    var params = {};
    try {
        var search = window.location.search;
        if (!search || search.length <= 1) return params;
        var pairs = search.substring(1).split('&');
        for (var i = 0; i < pairs.length; i++) {
            var kv = pairs[i].split('=');
            if (kv[0]) {
                params[decodeURIComponent(kv[0])] = kv[1] ? decodeURIComponent(kv[1]) : '';
            }
        }
    } catch(e) {}
    return params;
}

// ==================== 路由检测 ====================
function checkRoute() {
    var params = getUrlParams();
    var action = params['action'];
    if (action === 'checkin') {
        showSignPage('checkin');
        return true;
    } else if (action === 'checkout') {
        showSignPage('checkout');
        return true;
    }
    return false;
}

    } catch (error) {
        console.error('加载历史记录失败:', error);
        list.innerHTML = '<li class="history-empty">加载失败，请重试</li>';
    }
}

function closeHistory() {
    document.getElementById('historyModal').classList.remove('active');
}

async function loadTraining(id) {
    closeHistory();

    // 显示加载状态
    var btn = document.querySelector('button[onclick="refreshData()"]');
    if (btn) { btn.disabled = true; btn.textContent = '加载中...'; }

    try {
        currentTrainingId = id;
        signRecords = [];

        // 加载培训信息
        var result = await _sbClient
            .from('training_info')
            .select('*')
            .eq('id', id)
            .single();

        if (result.data) {
            var info = result.data;
            document.getElementById('course').value = info.course || '';
            document.getElementById('trainDate').value = info.train_date || '';
            document.getElementById('trainTime').value = info.train_time || '';
            document.getElementById('totalHours').value = info.total_hours || '';
            document.getElementById('trainer').value = info.trainer || '';
            document.getElementById('totalCount').value = info.total_count || '';
            document.getElementById('location').value = info.location || '';
            document.getElementById('organizer').value = info.organizer || '';
        }

        // 加载签到记录
        await loadSignRecords();

        // 重新订阅实时更新（确保订阅新的 training_id）
        subscribeToChanges();

    } catch (error) {
        console.error('加载培训失败:', error);
        alert('加载失败，请重试！');
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = '刷新数据'; }
    }
}

function createNewTraining() {
    closeHistory();

    // 确认是否保存当前数据
    if (currentTrainingId && document.getElementById('course').value) {
        if (!confirm('当前有未保存或已保存的培训数据。\n点击"确定"将创建新的空白签到表。\n历史数据可在"历史记录"中查看。')) {
            return;
        }
    }

    // 重置为空白状态
    currentTrainingId = null;
    signRecords = [];

    document.getElementById('course').value = '';
    document.getElementById('trainDate').value = '';
    document.getElementById('trainTime').value = '';
    document.getElementById('totalHours').value = '';
    document.getElementById('trainer').value = '';
    document.getElementById('totalCount').value = '';
    document.getElementById('location').value = '';
    document.getElementById('organizer').value = '';

    renderTable();
    updateStats();

    // 取消订阅
    if (realtimeChannel) {
        _sbClient.removeChannel(realtimeChannel);
        realtimeChannel = null;
    }
}

async function deleteTraining(id, event) {
    event.stopPropagation();

    if (!confirm('确定要删除该培训记录吗？\n此操作不可撤销，所有签到数据将一并删除！')) {
        return;
    }

    try {
        // 删除签到记录
        await _sbClient.from('sign_records').delete().eq('training_id', id);
        // 删除培训信息
        await _sbClient.from('training_info').delete().eq('id', id);

        // 如果删除的是当前加载的培训，重置页面
        if (currentTrainingId === id) {
            createNewTraining();
        }

        // 刷新列表
        showHistory();

    } catch (error) {
        console.error('删除失败:', error);
        alert('删除失败，请重试！');
    }
}

// 点击弹窗背景关闭
document.addEventListener('click', function(e) {
    var modal = document.getElementById('historyModal');
    if (e.target === modal) {
        closeHistory();
    }
});

// ESC 键关闭弹窗
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeHistory();
    }
});

// ==================== 初始化 ====================
async function init() {
    // 先检查是否是扫码入口
    if (!checkRoute()) {
        await initSupabase();

        // 每次打开都是空白状态
        currentTrainingId = null;
        signRecords = [];
        renderTable();
        updateStats();

        // 监听顶部信息变更（首次保存时创建新培训）
        var fields = ['course', 'trainDate', 'trainTime', 'totalHours', 'trainer', 'totalCount', 'location', 'organizer'];
        fields.forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.addEventListener('change', function() {
                // 有内容变化时自动保存（创建新培训）
                if (document.getElementById('course').value || document.getElementById('trainDate').value) {
                    saveInfo();
                }
            });
        });
    }
}

// 等待DOM加载完成
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>
</body>
</html>
